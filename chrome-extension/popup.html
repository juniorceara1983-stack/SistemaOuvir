<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>+Voz – Acessibilidade Auditiva</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header>
    <!-- Inline SVG logo so no extra file is needed -->
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#1a73e8"/>
      <!-- Plus sign -->
      <rect x="10" y="28" width="18" height="8" rx="2" fill="#fff"/>
      <rect x="28" y="28" width="8"  height="8" rx="2" fill="#fff"/>
      <rect x="28" y="12" width="8" height="24" rx="2" fill="#fff"/>
      <!-- Sound waves -->
      <path d="M38 38 A10 10 0 0 0 38 26" stroke="#FF6600" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M43 43 A18 18 0 0 0 43 21" stroke="#FF6600" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M48 47 A25 25 0 0 0 48 17" stroke="#FF6600" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    </svg>
    <h1>+Voz</h1>
  </header>

  <section class="toggle-row">
    <span class="toggle-label" id="statusLabel">Desativado</span>
    <label class="switch" aria-label="Ativar ou desativar SistemaOuvir">
      <input type="checkbox" id="toggleSwitch" />
      <span class="slider"></span>
    </label>
  </section>

  <hr />

  <section class="settings">
    <h2>Configurações</h2>

    <div class="field-group">
      <label for="langSelect">Idioma da voz</label>
      <select id="langSelect">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="pt-PT">Português (Portugal)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="it-IT">Italiano</option>
        <option value="ja-JP">日本語</option>
        <option value="zh-CN">中文</option>
      </select>
    </div>

    <div class="field-group">
      <label for="rateRange">
        Velocidade: <span id="rateValue">1.1</span>×
      </label>
      <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1.1" />
    </div>

    <div class="field-group">
      <label for="pitchRange">
        Tom: <span id="pitchValue">1.0</span>
      </label>
      <input type="range" id="pitchRange" min="0" max="2" step="0.1" value="1" />
    </div>

    <div class="field-group">
      <label for="debounceRange">
        Delay (ms): <span id="debounceValue">100</span>
      </label>
      <input type="range" id="debounceRange" min="50" max="500" step="50" value="100" />
    </div>
  </section>

  <footer>
    <p>+Voz · Inclusão que se ouve · Web Speech API</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
